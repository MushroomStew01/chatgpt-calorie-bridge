openapi: 3.1.0
info:
  title: Calorie Bridge
  version: 1.5.0
  description: Log estimated meals, automatically match them to FatSecret when connected, and retrieve daily calorie totals.
servers:
  - url: https://chatgpt-calorie-bridge.onrender.com
paths:
  /api/meals:
    post:
      operationId: logMeal
      summary: Log a meal and auto-sync the best FatSecret food and serving when connected
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, calories]
              properties:
                name: { type: string }
                calories: { type: number }
                protein: { type: number, default: 0 }
                carbs: { type: number, default: 0 }
                fat: { type: number, default: 0 }
                fiber: { type: number, default: 0 }
                sugar: { type: number, default: 0 }
                meal_type: { type: string, enum: [breakfast, lunch, dinner, other], default: other }
                notes: { type: string, default: "" }
                eaten_at: { type: string, format: date-time }
                fatsecret_search_query:
                  type: string
                  description: Optional concise food name to improve FatSecret matching; omit to use name.
      responses:
        "200": { description: Meal logged }
    get:
      operationId: getMeals
      summary: Get logged meals
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: day
          schema: { type: string, format: date }
      responses:
        "200": { description: Meals }
  /api/summary:
    get:
      operationId: getDailySummary
      summary: Get daily calorie and macro totals
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: day
          schema: { type: string, format: date }
      responses:
        "200": { description: Daily summary }
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
