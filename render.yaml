databases:
  - name: calorie-bridge-db
    plan: free
    databaseName: calorie_bridge
    user: calorie_bridge
    ipAllowList: []

services:
  - type: web
    name: chatgpt-calorie-bridge
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-bridge-db
          property: connectionString
      - key: APP_API_KEY
        generateValue: true
      - key: DASHBOARD_USERNAME
        value: andy
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Toronto
      - key: DAILY_CALORIE_GOAL
        value: "2000"
