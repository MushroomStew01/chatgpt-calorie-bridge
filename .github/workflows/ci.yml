name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx mcp==1.30.0
      - run: python -m pytest -q
      - name: Validate Raspberry Pi shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Raspberry Pi Compose configuration
        run: |
          cp .env.pi.example .env.pi
          docker compose --env-file .env.pi -f docker-compose.pi.yml config >/dev/null
